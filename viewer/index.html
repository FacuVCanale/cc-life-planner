<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cc-life-planner — tablero del día</title>
    <meta name="description" content="Tablero diario del planner: fijo, must-do, carriles y alertas." />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230f172a'/><path d='M9 16.5l4.5 4.5L23 11' stroke='%2360a5fa' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <div class="brand">cc-life-planner</div>
      <nav class="dates">
        <button id="btn-prev" title="día anterior">&larr;</button>
        <button id="btn-today" class="primary">inicio</button>
        <button id="btn-next" title="día siguiente">&rarr;</button>
        <input type="date" id="date-picker" />
      </nav>
      <nav class="views">
        <button id="btn-day" class="active">día</button>
        <button id="btn-stats">stats 30d</button>
      </nav>
    </header>

    <main>
      <section id="view-day">
        <article class="brief" id="brief"></article>
      </section>

      <section id="view-stats" hidden>
        <div class="stats-header">
          <h1>Stats últimos 30 días</h1>
          <select id="stats-window">
            <option value="7">7 días</option>
            <option value="30" selected>30 días</option>
            <option value="90">90 días</option>
          </select>
        </div>
        <div id="stats-content">cargando…</div>
      </section>
    </main>

    <script src="/viewer.js"></script>
    <script src="/stats.js"></script>
  </body>
</html>
